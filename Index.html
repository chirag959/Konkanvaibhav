<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap — Konkan Vaibhav × Momo Mania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#3178B4;
    --blue-deep:#1d5582;
    --blue-soft:#eef4fb;
    --line:#e4ecf4;
    --paper:#FCFCFC;
    --ink:#000000;
    --muted:#5a5f66;
    --r:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Hanken Grotesk',sans-serif;background:var(--paper);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  ::selection{background:var(--blue);color:#fff}
  .wrap{max-width:980px;margin:0 auto;padding:0 22px}

  /* ---- top bar ---- */
  .top{position:sticky;top:0;z-index:40;background:rgba(252,252,252,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .top-in{max-width:980px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Schibsted Grotesk';font-weight:800;font-size:14px;letter-spacing:-.01em}
  .logo span{color:var(--blue)}
  .logo .mark{width:32px;height:32px;border-radius:8px;display:block;box-shadow:0 4px 12px -6px rgba(31,85,130,.5)}
  .flogo{width:38px;height:38px;border-radius:9px;display:block;margin:0 auto 12px}

  /* ---- filter switch ---- */
  .switch{position:relative;display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px}
  .switch button{position:relative;z-index:2;border:0;background:transparent;cursor:pointer;
    font-family:'Hanken Grotesk';font-weight:600;font-size:13.5px;color:var(--muted);
    padding:8px 18px;border-radius:999px;transition:color .3s}
  .switch button.on{color:#fff}
  .glide{position:absolute;z-index:1;top:4px;bottom:4px;border-radius:999px;background:var(--blue);
    transition:transform .42s cubic-bezier(.6,.05,.1,1),width .42s cubic-bezier(.6,.05,.1,1);box-shadow:0 6px 16px -6px var(--blue)}

  /* ---- hero ---- */
  .hero{padding-top:46px;padding-bottom:14px}
  .hero-card{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:center}
  @media(max-width:760px){.hero-card{grid-template-columns:1fr}}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
  .hero h1{font-family:'Schibsted Grotesk';font-weight:800;letter-spacing:-.03em;font-size:clamp(36px,6.5vw,62px);line-height:.98;margin:16px 0 12px}
  .hero .meta{font-size:14.5px;color:var(--muted);font-weight:500}
  .hero .meta b{color:var(--ink);font-weight:600}
  .hero .goal{margin-top:16px;font-size:14px;color:var(--ink);background:var(--blue-soft);border:1px solid var(--line);padding:11px 15px;border-radius:12px;display:inline-block}
  .hero-visual{aspect-ratio:1/.86;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:0 26px 60px -34px rgba(31,85,130,.6);position:relative}
  .hero-visual img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-visual.placeholder{display:grid;place-items:center;background:linear-gradient(140deg,var(--blue),var(--blue-deep));color:#fff;text-align:center;padding:20px}
  .hero-visual.placeholder .big{font-family:'Schibsted Grotesk';font-weight:800;font-size:clamp(30px,6vw,54px);letter-spacing:-.03em;line-height:.95}
  .hero-visual.placeholder .em{font-size:46px;margin-bottom:10px}

  /* ---- month nav (sticky sub) ---- */
  .mnav{position:sticky;top:var(--topH,57px);z-index:30;background:rgba(252,252,252,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);margin-top:18px}
  .mnav-in{max-width:980px;margin:0 auto;padding:11px 22px;display:flex;gap:8px}
  .mnav a{font-size:12.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:6px 14px;border-radius:999px;transition:.25s;border:1px solid transparent}
  .mnav a:hover{color:var(--blue)}
  .mnav a.on{background:var(--ink);color:#fff}

  /* ---- months ---- */
  #stage{padding:30px 0 60px}
  .month{padding:26px 0 8px;scroll-margin-top:110px}
  .month-head{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
  .mnum{font-family:'Schibsted Grotesk';font-weight:800;font-size:clamp(40px,7vw,76px);line-height:.8;color:var(--blue);opacity:.16;letter-spacing:-.04em}
  .mtitle{font-family:'Schibsted Grotesk';font-weight:700;font-size:clamp(20px,3vw,30px);letter-spacing:-.02em;line-height:1.05}
  .msub{font-size:12px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-top:7px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;transition:transform .3s,box-shadow .3s,border-color .3s;position:relative}
  .card:hover{transform:translateY(-5px);box-shadow:0 20px 44px -30px rgba(31,85,130,.55);border-color:#d3e0ee}
  .card h3{font-family:'Schibsted Grotesk';font-weight:700;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .card h3 i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);font-style:normal;font-size:15px;flex-shrink:0}
  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--blue);color:#fff;padding:4px 10px;border-radius:999px;margin-bottom:12px}
  ul{list-style:none;display:flex;flex-direction:column;gap:9px}
  ul li{position:relative;padding-left:20px;font-size:13.6px;color:var(--muted);font-weight:500}
  ul li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:2px;background:var(--blue);transform:rotate(45deg)}
  ul li b{color:var(--ink);font-weight:700}

  /* reels highlight */
  .reels-hi{background:linear-gradient(135deg,var(--blue),var(--blue-deep));color:#fff;border-radius:13px;padding:18px;margin-bottom:14px}
  .reels-hi .n{font-family:'Schibsted Grotesk';font-weight:800;font-size:34px;line-height:1}
  .reels-hi .n small{font-size:13px;font-weight:600;opacity:.85}
  .reels-hi .sp{display:flex;gap:10px;margin-top:12px}
  .reels-hi .sp div{flex:1;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:9px 11px}
  .reels-hi .sp b{display:block;font-family:'Schibsted Grotesk';font-size:19px}
  .reels-hi .sp span{font-size:11px;opacity:.9}

  /* steps */
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;grid-column:1/-1}
  @media(max-width:820px){.steps{grid-template-columns:1fr 1fr}}
  .step{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px;transition:.3s}
  .step:hover{transform:translateY(-4px);border-color:var(--blue)}
  .step .s{font-family:'Schibsted Grotesk';font-weight:800;font-size:11px;color:var(--blue);letter-spacing:.08em}
  .step h4{font-size:13.5px;font-weight:700;margin:5px 0 6px}
  .step p{font-size:12.5px;color:var(--muted)}

  /* ads */
  .ad{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:.3s}
  .ad:hover{transform:translateY(-4px);box-shadow:0 18px 40px -30px rgba(31,85,130,.5)}
  .ad h4{font-family:'Schibsted Grotesk';font-size:16px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:9px}
  .ad .tags{display:flex;flex-wrap:wrap;gap:7px}
  .ad .tags span{font-size:11.5px;font-weight:600;background:var(--blue-soft);color:var(--blue);padding:5px 10px;border-radius:8px}

  .span2{grid-column:span 2}
  @media(max-width:820px){.span2{grid-column:auto}}
  .secline{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:6px 0 12px;grid-column:1/-1}

  /* footer */
  footer{border-top:1px solid var(--line);padding:26px 0 50px;text-align:center;color:var(--muted);font-size:12.5px}
  footer b{color:var(--blue)}

  /* anim */
  .fade-stage{animation:fade .45s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .rv{opacity:0;transform:translateY(18px);transition:.55s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}

  /* ---- mobile ---- */
  @media(max-width:600px){
    .wrap{padding:0 16px}
    .top-in{padding:10px 16px;gap:10px;justify-content:center}
    .logo{font-size:13px;gap:8px}
    .logo .mark{width:28px;height:28px}
    .switch{width:100%}
    .switch button{flex:1;text-align:center;padding:10px 8px;font-size:13.5px}
    .hero{padding-top:30px}
    .hero h1{margin:12px 0 10px}
    .hero-visual{aspect-ratio:auto;max-height:280px}
    .mnav-in{padding:10px 16px}
    .mnav a{padding:7px 13px}
    .steps{grid-template-columns:1fr}
    .month{padding-top:20px}
    .month-head{gap:12px}
    .secline{margin-top:2px}
  }
</style>
</head>

/* ---- renderers ---- */
function reelsCard(mode){
  if(mode==='momo'){
    return `<div class="card">
      <span class="pill">4 Reels + 4 Posts</span>
      <h3><i>▶</i>Reels & Posts</h3>
      <div class="reels-hi">
        <div class="n">4 <small>reels / month</small></div>
        <div class="sp"><div><b>4</b><span>reels by our team</span></div><div><b>4</b><span>feed posts</span></div></div>
      </div>
      <ul>
        <li>Food reveal / behind-the-scenes</li>
        <li>Momo-making / process clips</li>
        <li>Customer reaction / testimonials</li>
        <li>Stories: polls, questions, countdowns</li>
      </ul></div>`;
  }
  return `<div class="card">
    <span class="pill">6 Reels / month</span>
    <h3><i>▶</i>Reels & Posts</h3>
    <div class="reels-hi">
      <div class="n">6 <small>reels / month</small></div>
      <div class="sp"><div><b>4</b><span>by our team</span></div><div><b>2</b><span>by the influencer</span></div></div>
    </div>
    <ul>
      <li>Food reveal / behind-the-scenes</li>
      <li>Chef's story / cooking process</li>
      <li>Customer reaction / testimonials</li>
      <li><b>5 feed posts</b></li>
      <li>Stories: polls, questions, countdowns</li>
    </ul></div>`;
}
function listCard(b){
  return `<div class="card${b.span2?' span2':''}">
    ${b.pill?`<span class="pill">${b.pill}</span>`:''}
    <h3><i>${b.icon}</i>${b.title}</h3>
    <ul>${b.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
}
function stepsCards(){
  const s=[
    ['STEP 1 · RELATIVES','Honest reviews','Family visits & leaves reviews. Personal WhatsApp outreach with the Google review link.'],
    ['STEP 2 · FRIENDS','Friend circle','Outreach to friends. Complimentary dish for those who visit and leave a review.'],
    ['STEP 3 · CUSTOMERS','QR on the bill','QR code on bill/table to the review page. Staff trained to ask after positive meals.'],
    ['STEP 4 · NEW (ADS)','Ad-driven footfall','Convert to reviews via table cards + WhatsApp follow-up message.']
  ];
  return `<div class="steps">${s.map(x=>`<div class="step"><div class="s">${x[0]}</div><h4>${x[1]}</h4><p>${x[2]}</p></div>`).join('')}</div>`;
}
function adsCards(){
  return `<div class="ad"><h4>🔍 Google Ads</h4><div class="tags">
      <span>Best at 4+ star reviews</span><span>Targets "restaurants near me"</span><span>₹200–500 / day</span></div></div>
    <div class="ad"><h4>📸 Meta Ads — IG / FB</h4><div class="tags">
      <span>Ideal for visual food content</span><span>Bhandup + 5km radius</span><span>Great food ROI</span><span>₹150–300 / day</span></div></div>`;
}
function adsCardsMomo(){
  return `<div class="ad"><h4>📣 Boost Top Content</h4><div class="tags">
      <span>Boost best reels & posts</span><span>Bhandup audience</span><span>Push proven content only</span><span>₹100–200 / day</span></div></div>
    <div class="ad"><h4>📍 Meta Ads — Bhandup</h4><div class="tags">
      <span>Target Bhandup + Mulund / Ghatkopar</span><span>Quick-bite / food lovers</span><span>Footfall + page discovery</span><span>₹150–300 / day</span></div></div>`;
}

function renderHero(key){
  const b=DATA[key];
  const visual=b.img
    ? `<div class="hero-visual"><img src="${b.img}" alt="${b.name}"></div>`
    : `<div class="hero-visual placeholder"><div><div class="em">${b.emoji}</div><div class="big">${b.name}</div></div></div>`;
  return `<div class="hero-card fade-stage">
    <div>
      <span class="eyebrow">3-Month Growth Plan</span>
      <h1>${b.name}</h1>
      <p class="meta"><b>${b.type}</b><br>${b.loc}</p>
      <div class="goal">Goal — ${b.goal}</div>
    </div>
    ${visual}
  </div>`;
}

function renderStage(key){
  const b=DATA[key];
  let html='';
  b.months.forEach(m=>{
    html+=`<div class="month" id="m${m.n}">
      <div class="month-head"><div class="mnum">${m.n}</div>
        <div><div class="mtitle">${m.title}</div><div class="msub">${m.sub}</div></div></div>
      <div class="grid">`;
    m.blocks.forEach(blk=>{
      if(blk.secline){html+=`<div class="secline">${blk.secline}</div>`;}
      else if(blk.type==='reels'){html+=reelsCard(blk.mode);}
      else if(blk.type==='steps'){html+=stepsCards();}
      else if(blk.type==='ads'){html+=adsCards();}
      else if(blk.type==='ads-momo'){html+=adsCardsMomo();}
      else {html+=listCard(blk);}
    });
    html+=`</div></div>`;
  });
  return html;
}

/* size sticky offsets so nothing overlaps when the header wraps on mobile */
function fitSticky(){
  const top=document.querySelector('.top').offsetHeight;
  document.documentElement.style.setProperty('--topH',top+'px');
  const mnavH=document.querySelector('.mnav').offsetHeight;
  document.querySelectorAll('.month').forEach(m=>m.style.scrollMarginTop=(top+mnavH+12)+'px');
}

let current='konkan';
function setBrand(key){
  current=key;
  document.getElementById('hero').innerHTML=renderHero(key);
  const stage=document.getElementById('stage');
  stage.innerHTML=renderStage(key);
  stage.classList.remove('fade-stage'); void stage.offsetWidth; stage.classList.add('fade-stage');
  // buttons
  document.querySelectorAll('#switch button').forEach(btn=>btn.classList.toggle('on',btn.dataset.brand===key));
  moveGlide();
  observeReveals();
  resetMnav();
  fitSticky();
}

/* sliding indicator */
function moveGlide(){
  const sw=document.getElementById('switch');
  const active=sw.querySelector('button.on');
  const g=document.getElementById('glide');
  g.style.width=active.offsetWidth+'px';
  g.style.transform=`translateX(${active.offsetLeft-4}px)`;
}

/* reveal on scroll */
let io;
function observeReveals(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.card,.step,.ad').forEach((el,i)=>{el.classList.add('rv');el.style.transitionDelay=(i%3*55)+'ms';io.observe(el);});
}

/* month sub-nav active state */
function resetMnav(){
  const links=[...document.querySelectorAll('.mnav a')];
  const secs=links.map(l=>document.querySelector(l.getAttribute('href')));
  if(window._mio)window._mio.disconnect();
  window._mio=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){links.forEach(l=>l.classList.remove('on'));
      const l=links.find(x=>x.getAttribute('href')==='#'+e.target.id);if(l)l.classList.add('on');}
  }),{rootMargin:'-40% 0px -55% 0px'});
  secs.forEach(s=>s&&window._mio.observe(s));
}

document.getElementById('switch').addEventListener('click',e=>{
  const btn=e.target.closest('button'); if(!btn)return; setBrand(btn.dataset.brand);
});
window.addEventListener('resize',()=>{moveGlide();fitSticky();});
window.addEventListener('load',()=>{setBrand('konkan');fitSticky();});
setBrand('konkan');
</script>
</body>
</html>
